name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows x64
        run: dotnet publish windows/KeyboardDrop.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Package Windows zip
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath KeyboardDrop-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardDrop-Windows
          path: KeyboardDrop-Windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KeyboardDrop-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
