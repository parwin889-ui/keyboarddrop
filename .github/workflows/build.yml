name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows x64
        run: dotnet publish windows/KeyboardDrop.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Package Windows zip
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath KeyboardDrop-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardDrop-Windows
          path: KeyboardDrop-Windows.zip

      - name: Release Windows
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KeyboardDrop-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r linux/requirements.txt

      - name: Build Linux binary with PyInstaller
        run: |
          cd linux
          pyinstaller --onefile --name keyboarddrop main.py
          ls -lh dist/

      - name: Package Linux tar.gz
        run: |
          mkdir -p dist-pkg
          cp linux/dist/keyboarddrop dist-pkg/
          cp linux/README.md dist-pkg/README-Linux.md
          cp linux/requirements.txt dist-pkg/
          cd dist-pkg
          tar -czf ../KeyboardDrop-Linux.tar.gz *
          cd ..
          ls -lh KeyboardDrop-Linux.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardDrop-Linux
          path: KeyboardDrop-Linux.tar.gz

      - name: Release Linux
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KeyboardDrop-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
