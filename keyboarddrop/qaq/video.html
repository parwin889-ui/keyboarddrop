<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyboardDrop 宣传视频</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0f0f2e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 40px 20px;
  }
  h1 {
    color: #fff;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    color: rgba(255,255,255,0.6);
    font-size: 16px;
    margin-bottom: 40px;
  }
  .video-wrapper {
    width: 100%;
    max-width: 960px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 80px rgba(96, 165, 250, 0.25), 0 0 0 1px rgba(255,255,255,0.1);
    background: #000;
  }
  video {
    width: 100%;
    display: block;
  }
  .info {
    margin-top: 30px;
    display: flex;
    gap: 24px;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
  }
  .info span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>
  <h1>KeyboardDrop 宣传视频</h1>
  <p class="subtitle">轻量级键盘按键重映射工具</p>
  <div class="video-wrapper">
    <video controls autoplay loop muted playsinline>
      <source src="keyboarddrop-promo.mp4" type="video/mp4">
      您的浏览器不支持 video 标签。
    </video>
  </div>
  <div class="info">
    <span>⏱ 12 秒</span>
    <span>📐 1280 × 720</span>
    <span>🎬 16:9</span>
  </div>
</body>
</html>
